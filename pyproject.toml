[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "modkit-events"
version = "0.1.0"
description = "Explicit, duplicate-aware event delivery and durable inbox/outbox primitives"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.optional-dependencies]
redis = ["redis>=8.1,<9"]
sqlalchemy = ["SQLAlchemy[asyncio]>=2.1.6,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/modkit_events"]
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md", "requirements-dev.txt"]
