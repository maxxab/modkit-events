# Release export for git-cliff==2.14.2. Canonical CI checks use standards.py.
# Use --offline --output RELEASE_NOTES.md; never overwrite CHANGELOG.md.
[changelog]
header = "# Release Notes\n\n"
body = """
{% if version %}## {{ version }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} (`{{ commit.id | truncate(length=12, end="") }}`)
{% endfor %}
{% endfor %}
"""
trim = true
footer = "\n<!-- Generated by git-cliff 2.14.2; separate release export. -->\n"

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 00 -->Breaking Changes" },
  { message = "^feat", group = "<!-- 01 -->Features" },
  { message = "^fix", group = "<!-- 02 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 03 -->Performance" },
  { message = "^security", group = "<!-- 04 -->Security" },
  { message = "^refactor", group = "<!-- 05 -->Refactoring" },
  { message = "^docs", group = "<!-- 06 -->Documentation" },
  { message = "^test", group = "<!-- 07 -->Testing" },
  { message = "^build", group = "<!-- 08 -->Build System" },
  { message = "^ci", group = "<!-- 09 -->CI/CD" },
  { message = "^(chore|style)", group = "<!-- 10 -->Maintenance" },
  { message = "^revert", group = "<!-- 11 -->Reverts" },
]
filter_commits = true
protect_breaking_commits = true
topo_order = true
sort_commits = "oldest"
