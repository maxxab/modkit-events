name: Verified PyPI release
'on':
  push:
    tags:
    - v*
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest_sha: ${{ steps.manifest.outputs.manifest_sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Verify exact tag, source and canonical history
      shell: bash
      env:
        PROJECT: modkit-events
        SOURCE_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |-
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        git merge-base --is-ancestor "$SOURCE_SHA" origin/main
        python - <<'PYCODE'
        import os,tomllib,re
        p=tomllib.load(open('pyproject.toml','rb'))['project']
        assert p['name']==os.environ['PROJECT']
        assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',p['version'])
        assert os.environ['RELEASE_TAG']=='v'+p['version']
        PYCODE
        MESSAGE=$(mktemp)
        trap 'rm -f "$MESSAGE"' EXIT
        for COMMIT in $(git rev-list --reverse --topo-order "$SOURCE_SHA"); do
         git show -s --format=%B "$COMMIT" > "$MESSAGE"
         python .development-standards/standards.py validate-message "$MESSAGE"
        done
        python .development-standards/standards.py changelog --check
    - run: python -m pip install -r requirements-dev.txt
    - run: python -m build
    - run: python -m twine check dist/*
    - id: manifest
      shell: bash
      env:
        PROJECT: modkit-events
        SOURCE_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: python scripts/release_verify.py create --directory dist --project "$PROJECT" --sha "$SOURCE_SHA" --tag
        "$RELEASE_TAG"
    - id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-${{ github.sha }}
        path: dist/*
        if-no-files-found: error
        overwrite: false
        retention-days: 14
    if: github.repository == 'maxxab/modkit-events' && github.event_name == 'push' && github.ref_type == 'tag'
  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python:
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.15'
    env:
      PROJECT: modkit-events
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
      MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact_id }}
        path: release-input
        merge-multiple: true
        digest-mismatch: error
    - run: python scripts/release_verify.py verify --directory release-input --project "$PROJECT" --sha "$SOURCE_SHA"
        --tag "$RELEASE_TAG" --manifest-sha "$MANIFEST_SHA"
    - run: python -m pip install -r requirements-dev.txt
    - run: python -m ruff check src tests examples scripts
    - run: python -m ruff format --check src tests examples scripts
    - run: python -m mypy src/modkit_events --ignore-missing-imports
    - run: python -m pytest -q
    - run: python scripts/release_verify.py test --directory release-input --project "$PROJECT" --sha "$SOURCE_SHA"
        --tag "$RELEASE_TAG" --manifest-sha "$MANIFEST_SHA"
    if: github.repository == 'maxxab/modkit-events' && github.event_name == 'push' && github.ref_type == 'tag'
  redis:
    needs: build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.3
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PROJECT: modkit-events
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
      MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
      MODKIT_REDIS_URL: redis://localhost:6379/0
      MODKIT_REQUIRE_REDIS: '1'
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact_id }}
        path: release-input
        merge-multiple: true
        digest-mismatch: error
    - run: python scripts/release_verify.py verify --directory release-input --project "$PROJECT" --sha "$SOURCE_SHA"
        --tag "$RELEASE_TAG" --manifest-sha "$MANIFEST_SHA"
    - run: python -m pip install -r requirements-dev.txt
    - run: python scripts/release_verify.py test --directory release-input --project "$PROJECT" --sha "$SOURCE_SHA"
        --tag "$RELEASE_TAG" --manifest-sha "$MANIFEST_SHA" --redis
    if: github.repository == 'maxxab/modkit-events' && github.event_name == 'push' && github.ref_type == 'tag'
  publish:
    needs:
    - build
    - test
    - redis
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: modkit-events
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
      MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact_id }}
        path: release-input
        merge-multiple: true
        digest-mismatch: error
    - name: Verify exact tested artifact; do not execute repository code
      shell: python
      run: |
        import hashlib,json,os,pathlib,re,shutil
        root=pathlib.Path('release-input')
        p=root/'manifest.json'
        assert p.is_file() and not p.is_symlink()
        assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['MANIFEST_SHA']
        m=json.loads(p.read_text())
        assert m['schema']==1 and m['project']==os.environ['PROJECT']
        assert m['source_sha']==os.environ['SOURCE_SHA'] and m['tag']==os.environ['RELEASE_TAG']
        assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',m['version']) and m['tag']=='v'+m['version']
        stem=m['project'].replace('-','_')+'-'+m['version']
        assert set(m['files'])=={stem+'-py3-none-any.whl',stem+'.tar.gz'}
        assert {p.name for p in root.iterdir()}==set(m['files'])|{'manifest.json'}
        out=pathlib.Path('publish-dist');out.mkdir(exist_ok=False)
        for name,item in m['files'].items():
         p=root/name
         assert p.is_file() and not p.is_symlink()
         assert p.stat().st_size==item['size'] and hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
         shutil.copyfile(p,out/name)
         assert hashlib.sha256((out/name).read_bytes()).hexdigest()==item['sha256']
    - name: Publish tested files with Trusted Publishing and attestations
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      with:
        packages-dir: publish-dist/
        attestations: true
        skip-existing: false
    if: github.repository == 'maxxab/modkit-events' && github.event_name == 'push' && github.ref_type == 'tag'
