name: Package CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate event commits and deterministic changelog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE=$(git merge-base "$PR_BASE" "$HEAD")
            python .development-standards/standards.py validate-range "$BASE" "$HEAD"
          elif [ "$EVENT_NAME" = push ]; then
            if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
              # An initial push has no base commit: include every root and descendant.
              MESSAGE=$(mktemp)
              trap 'rm -f "$MESSAGE"' EXIT
              for COMMIT in $(git rev-list --reverse --topo-order "$HEAD"); do
                git show -s --format=%B "$COMMIT" > "$MESSAGE"
                python .development-standards/standards.py validate-message "$MESSAGE"
              done
            else
              python .development-standards/standards.py validate-range "$BEFORE" "$HEAD"
            fi
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi
          python .development-standards/standards.py changelog --check
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check src tests examples scripts
      - run: python -m ruff format --check src tests examples scripts
      - run: python -m mypy src/modkit_events --ignore-missing-imports
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Installed wheel
        shell: bash
        run: python scripts/check_wheel.py dist/*.whl
  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.3
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MODKIT_REDIS_URL: redis://localhost:6379/0
      MODKIT_REQUIRE_REDIS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_redis.py
      - run: python -m build
      - run: python scripts/check_wheel.py dist/modkit_events-0.1.0-py3-none-any.whl --require-redis
      - name: Rebuild sdist and verify installed adapters
        run: |
          mkdir sdist-check
          tar -xzf dist/modkit_events-0.1.0.tar.gz -C sdist-check
          python -m build --wheel sdist-check/modkit_events-0.1.0 --outdir sdist-wheels
          python sdist-check/modkit_events-0.1.0/scripts/check_wheel.py sdist-wheels/modkit_events-0.1.0-py3-none-any.whl --require-redis
